<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBoard - Task Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .task-card {
            transition: all 0.3s ease;
        }
        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .completed {
            opacity: 0.7;
        }
        .completed .task-title {
            text-decoration: line-through;
        }
        .activity-item {
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <header class="mb-8">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-gray-800">DevBoard</h1>
                <div class="text-gray-600" id="currentDate"></div>
            </div>
        </header>

        <!-- Discover Banner -->
        <div class="bg-blue-500 text-white rounded-lg p-4 mb-8 flex items-center">
            <i class="fas fa-lightbulb text-2xl mr-3"></i>
            <span class="text-lg font-medium">Discover Something New Today!</span>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Tasks Section -->
            <div class="lg:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-gray-800">Tasks</h2>
                    <button id="addTaskBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center">
                        <i class="fas fa-plus mr-2"></i> Add Task
                    </button>
                </div>

                <!-- Task List -->
                <div id="taskList" class="space-y-4">
                    <!-- Tasks will be dynamically added here -->
                </div>
            </div>

            <!-- Activity Log -->
            <div class="lg:col-span-1">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">Activity Log</h2>
                <div class="bg-white rounded-lg shadow p-4">
                    <div id="activityLog" class="space-y-3 max-h-96 overflow-y-auto">
                        <!-- Activity items will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Task Modal -->
    <div id="addTaskModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-semibold mb-4">Add New Task</h3>
            <form id="addTaskForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="platform">Platform</label>
                    <input type="text" id="platform" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="taskName">Task Name</label>
                    <input type="text" id="taskName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="description">Description</label>
                    <textarea id="description" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="deadline">Deadline</label>
                    <input type="date" id="deadline" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancelBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Add Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Sample initial tasks
        let tasks = [
            {
                id: 1,
                platform: "Shoploase",
                name: "Fix Mobile Button Issue",
                description: "Fix the mobile button alignment issue on product pages",
                deadline: "2025-03-21",
                completed: true
            },
            {
                id: 2,
                platform: "CloudSync",
                name: "Add Dark Mode",
                description: "Implement dark mode toggle for better user experience",
                deadline: "2026-03-21",
                completed: false
            },
            {
                id: 3,
                platform: "DataFlow",
                name: "Optimize Database Queries",
                description: "Improve performance by optimizing slow database queries",
                deadline: "2025-08-15",
                completed: false
            },
            {
                id: 4,
                platform: "WebApp",
                name: "Update User Interface",
                description: "Redesign the user dashboard with new components",
                deadline: "2025-09-10",
                completed: false
            }
        ];

        // Activity log
        let activities = [
            { id: 1, text: "Completed task: Fix Mobile Button Issue", time: "10:30 AM" },
            { id: 2, text: "Added new task: Add Dark Mode", time: "9:15 AM" },
            { id: 3, text: "Updated task: Optimize Database Queries", time: "Yesterday" }
        ];

        // DOM elements
        const taskList = document.getElementById('taskList');
        const activityLog = document.getElementById('activityLog');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const addTaskModal = document.getElementById('addTaskModal');
        const addTaskForm = document.getElementById('addTaskForm');
        const cancelBtn = document.getElementById('cancelBtn');
        const currentDateElement = document.getElementById('currentDate');

        // Set current date
        function setCurrentDate() {
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            const today = new Date();
            currentDateElement.textContent = today.toLocaleDateString('en-US', options);
        }

        // Format date for display
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        // Render tasks
        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach(task => {
                const taskCard = document.createElement('div');
                taskCard.className = `task-card bg-white rounded-lg shadow p-4 ${task.completed ? 'completed' : ''}`;
                
                taskCard.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center mb-2">
                                <span class="inline-block w-3 h-3 rounded-full bg-blue-500 mr-2"></span>
                                <span class="text-sm font-medium text-gray-500">${task.platform}</span>
                            </div>
                            <h3 class="task-title text-lg font-semibold text-gray-800 mb-1">${task.name}</h3>
                            <p class="text-gray-600 text-sm mb-3">${task.description}</p>
                            <div class="flex items-center text-sm text-gray-500">
                                <i class="far fa-calendar-alt mr-1"></i>
                                <span>Deadline: ${formatDate(task.deadline)}</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="px-2 py-1 rounded-full text-xs font-medium ${task.completed ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'} mb-2">
                                ${task.completed ? 'Completed' : 'In Progress'}
                            </span>
                            <div class="flex space-x-2">
                                <button class="toggle-btn text-gray-500 hover:text-blue-500" data-id="${task.id}">
                                    <i class="fas ${task.completed ? 'fa-undo' : 'fa-check'}"></i>
                                </button>
                                <button class="delete-btn text-gray-500 hover:text-red-500" data-id="${task.id}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                taskList.appendChild(taskCard);
            });

            // Add event listeners to buttons
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.addEventListener('click', toggleTaskStatus);
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', deleteTask);
            });
        }

        // Render activity log
        function renderActivities() {
            activityLog.innerHTML = '';
            activities.forEach(activity => {
                const activityItem = document.createElement('div');
                activityItem.className = 'activity-item flex items-start';
                
                activityItem.innerHTML = `
                    <div class="bg-blue-100 rounded-full p-2 mr-3">
                        <i class="fas fa-info text-blue-500 text-xs"></i>
                    </div>
                    <div>
                        <p class="text-gray-800">${activity.text}</p>
                        <p class="text-gray-500 text-xs">${activity.time}</p>
                    </div>
                `;
                
                activityLog.appendChild(activityItem);
            });
        }

        // Toggle task status
        function toggleTaskStatus(e) {
            const taskId = parseInt(e.currentTarget.dataset.id);
            const task = tasks.find(t => t.id === taskId);
            
            if (task) {
                task.completed = !task.completed;
                renderTasks();
                
                // Add activity
                const action = task.completed ? 'completed' : 'reopened';
                addActivity(`${action.charAt(0).toUpperCase() + action.slice(1)} task: ${task.name}`);
            }
        }

        // Delete task
        function deleteTask(e) {
            const taskId = parseInt(e.currentTarget.dataset.id);
            const taskIndex = tasks.findIndex(t => t.id === taskId);
            
            if (taskIndex !== -1) {
                const taskName = tasks[taskIndex].name;
                tasks.splice(taskIndex, 1);
                renderTasks();
                
                // Add activity
                addActivity(`Deleted task: ${taskName}`);
            }
        }

        // Add activity to log
        function addActivity(text) {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            activities.unshift({
                id: activities.length + 1,
                text: text,
                time: time
            });
            
            // Keep only the latest 10 activities
            if (activities.length > 10) {
                activities = activities.slice(0, 10);
            }
            
            renderActivities();
        }

        // Show add task modal
        addTaskBtn.addEventListener('click', () => {
            addTaskModal.classList.remove('hidden');
        });

        // Hide add task modal
        cancelBtn.addEventListener('click', () => {
            addTaskModal.classList.add('hidden');
            addTaskForm.reset();
        });

        // Add new task
        addTaskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newTask = {
                id: tasks.length + 1,
                platform: document.getElementById('platform').value,
                name: document.getElementById('taskName').value,
                description: document.getElementById('description').value,
                deadline: document.getElementById('deadline').value,
                completed: false
            };
            
            tasks.push(newTask);
            renderTasks();
            addActivity(`Added new task: ${newTask.name}`);
            
            // Reset form and close modal
            addTaskForm.reset();
            addTaskModal.classList.add('hidden');
        });

        // Initialize the app
        function init() {
            setCurrentDate();
            renderTasks();
            renderActivities();
        }

        // Start the app
        init();
    </script>
</body>
</html>
